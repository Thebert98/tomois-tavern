name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web — type-check + build + test
    runs-on: ubuntu-latest
    env:
      # The Next.js build pre-renders pages, which loads lib/env.ts and
      # throws if these aren't set. Dummies satisfy the gate; nothing
      # in the static output is actually authenticated.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      NEXT_PUBLIC_REROLL_BASE_URL: https://example.com
      NEXT_PUBLIC_WORKSHOP_BASE_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          # pnpm 11.5+ requires Node 22.13+ (it imports node:sqlite).
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm type-check
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm --filter @tomois/web test

  workshop:
    name: workshop — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workshop
    env:
      # The workshop's `config.py` reads these on import. They're not
      # required to be valid here — `BaseSettings` defaults to empty
      # strings — but supplying them keeps the import path honest.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      SUPABASE_JWT_SECRET: dummy-secret-for-ci-only
      FAL_KEY: dummy
      SUNO_API_KEY: dummy
      ANTHROPIC_API_KEY: dummy
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/workshop/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest
        run: pytest
