name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web — type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm type-check
      - name: Build
        run: pnpm build

  workshop:
    name: workshop — import + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/workshop
    env:
      # The workshop's `config.py` reads these on import. They're not
      # required to be valid here — `BaseSettings` defaults to empty
      # strings — but supplying them keeps the import path honest.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_ROLE_KEY: dummy
      SUPABASE_JWT_SECRET: dummy-secret-for-ci-only
      FAL_KEY: dummy
      SUNO_API_KEY: dummy
      ANTHROPIC_API_KEY: dummy
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/workshop/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import smoke test
        # No pytest suite exists yet (see AUDIT.md R1). At minimum we
        # gate every PR on the module being importable so a syntax or
        # signature error in the workshop fails CI loudly.
        run: python -c "from app.main import app; print('workshop OK')"
